site_name: Introduction to Arabic Speech Technologies
site_url: https://arabic-speech-book.github.io/
site_description: 'Companion website for the book "Introduction to Arabic Speech Technologies" by Hend S. Al-Khalifa — notebooks, datasets, tools, glossary, bibliography and resources.'
site_author: Prof. Hend S. Al-Khalifa
repo_url: https://github.com/arabic-speech-book/arabic-speech-book.github.io
repo_name: arabic-speech-book
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 <a href="https://faculty.ksu.edu.sa/ar/hendk" target="_blank" rel="noopener">Prof. Hend S. Al-Khalifa</a> — Introduction to Arabic Speech Technologies

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/feedback.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - mkdocs-jupyter:
      include: ["*.ipynb"]
      include_source: true
      execute: false
      ignore_h1_titles: true
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ar
          name: العربية
          build: true
          site_name: مقدمة في تقنيات الكلام العربي
          site_description: 'الموقع المرافق لكتاب «مقدمة في تقنيات الكلام العربي» للدكتورة هند الخليفة — الدفاتر والبيانات والأدوات والمسرد وثبت المراجع والمصادر.'
          nav_translations:
            Home: الرئيسية
            About the Book: عن الكتاب
            Notebooks: الدفاتر البرمجية
            Resources: المصادر
            Resource Index: فهرس المصادر
            Datasets: قواعد البيانات
            Tools: الأدوات
            Conferences & Community: المؤتمرات والمجتمع
            Literature: المراجع
            Reference: المرجعيات
            Glossary: المسرد
            Abbreviations: قائمة الاختصارات
            Bibliography: ثبت المراجع
            Book Companion: ملحقات الكتاب
            Figure Sources: مصادر الأشكال
            Templates: القوالب
            Datasheet: بطاقة البيانات
            Consent Form: نموذج الموافقة
            Annotation Guideline: دليل الوسم
            Tool Reference: مرجع الأدوات
            Reproducibility Checklist: قائمة إعادة الإنتاج
            Applications & Methods: تطبيقات وطرائق جديدة
            Errata: التصويبات
            Changelog: سجل التغييرات
            Feedback: ملاحظات

nav:
  - Home: index.md
  - About the Book: about.md
  - Notebooks:
      - notebooks/index.md
      - notebooks/ch01_first_contact_arabic_asr.ipynb
      - notebooks/ch02_arabic_phonetics_g2p.ipynb
      - notebooks/ch03_speech_features.ipynb
      - notebooks/ch04_arabic_asr_foundations.ipynb
      - notebooks/ch05_end_to_end_arabic_asr.ipynb
      - notebooks/ch06_arabic_foundation_models.ipynb
      - notebooks/ch07_corpus_loader.ipynb
      - notebooks/ch08_dialect_id.ipynb
      - notebooks/ch08_speaker_and_noise.ipynb
      - notebooks/ch09_arabic_tts.ipynb
      - notebooks/ch10_speech_translation_slu.ipynb
      - notebooks/ch11_audio_llm_prompting.ipynb
  - Resources:
      - resources/index.md
      - Resource Index: resources/resource-index.md
      - Datasets: datasets.md
      - Tools: tools.md
      - Conferences & Community: community.md
      - Literature: resources/literature.md
  - Reference:
      - Glossary: glossary.md
      - Abbreviations: abbreviations.md
      - Bibliography: bibliography.md
  - Book Companion:
      - Figure Sources: figures.md
      - Templates:
          - book-templates/index.md
          - Datasheet: book-templates/datasheet.md
          - Consent Form: book-templates/consent-form.md
          - Annotation Guideline: book-templates/annotation-guideline.md
          - Tool Reference: book-templates/tool-reference.md
          - Reproducibility Checklist: book-templates/evaluation-and-reproducibility-checklist.md
      - Applications & Methods: applications.md
      - Errata: errata.md
      - Changelog: changelog.md
  - Feedback: feedback.md

extra:
  alternate:
    - name: English
      link: /
      lang: en
    - name: العربية
      link: /ar/
      lang: ar
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/arabic-speech-book
