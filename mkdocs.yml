site_name: Introduction to Arabic Speech Technology
site_url: https://arabic-speech-book.github.io/
site_description: 'Companion website for the book "Introduction to Arabic Speech Technology" by Hend S. Al-Khalifa — notebooks, datasets, tools, glossary, bibliography and resources.'
site_author: Prof. Hend S. Al-Khalifa
repo_url: https://github.com/arabic-speech-book/arabic-speech-book.github.io
repo_name: arabic-speech-book
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 <a href="https://faculty.ksu.edu.sa/ar/hendk" target="_blank" rel="noopener">Prof. Hend S. Al-Khalifa</a> — Introduction to Arabic Speech Technology

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/feedback.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - mkdocs-jupyter:
      include: ["*.ipynb"]
      include_source: true
      execute: false
      ignore_h1_titles: true
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ar
          name: العربية
          build: true
          site_name: مقدمة في تقنية الكلام العربي
          site_description: 'الموقع المرافق لكتاب «مقدمة في تقنية الكلام العربي» للدكتورة هند الخليفة — الدفاتر والبيانات والأدوات والمسرد وثبت المراجع والمصادر.'
          nav_translations:
            Home: الرئيسية
            About the Book: عن الكتاب
            Notebooks: الدفاتر البرمجية
            Exercise Solutions: حلول التمارين
            Chapter 1: الفصل 1
            Chapter 2: الفصل 2
            Chapter 3: الفصل 3
            Chapter 4: الفصل 4
            Chapter 5: الفصل 5
            Chapter 6: الفصل 6
            Chapter 7: الفصل 7
            Chapter 8: الفصل 8
            Chapter 9: الفصل 9
            Chapter 10: الفصل 10
            Chapter 11: الفصل 11
            Resources: المصادر
            Resource Index: فهرس المصادر
            Datasets: قواعد البيانات
            Tools: الأدوات
            Conferences & Community: المؤتمرات والمجتمع
            Literature: المراجع
            Reference: المرجعيات
            Glossary: المسرد
            Abbreviations: قائمة الاختصارات
            Bibliography: ثبت المراجع
            Book Companion: ملحقات الكتاب
            Figure Sources: مصادر الأشكال
            Templates: القوالب
            Datasheet: بطاقة البيانات
            Consent Form: نموذج الموافقة
            Annotation Guideline: دليل الوسم
            Tool Reference: مرجع الأدوات
            Reproducibility Checklist: قائمة إعادة الإنتاج
            Applications & Methods: تطبيقات وطرائق جديدة
            Errata: التصويبات
            Changelog: سجل التغييرات
            Feedback: ملاحظات

